# Local-only bindings for developer tools. Production uses docker-compose.yml alone.
services:
  sqlserver:
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
