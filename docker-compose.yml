name: jamesthew-platform

services:
  # =========================================================================
  # 1. API GATEWAY (YARP .NET 10 - INGRESS & REVERSE PROXY)
  # =========================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: jamesthew-gateway
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000
      - Jwt__Key=${JWT_KEY:-JamesThewCookingSecretKeyForJwtTokenAuth2026!#*VeryLongSecretKeyMustBe32BytesOrMore}
      - Jwt__Issuer=JamesThewApi
      - Jwt__Audience=JamesThewClient
      - ReverseProxy__Clusters__backend-cluster__Destinations__primary__Address=http://backend:5000
    depends_on:
      - backend
    networks:
      - jamesthew-internal-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # 2. FRONTEND SPA (REACT 19 + VITE + NGINX ALPINE)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jamesthew-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - jamesthew-internal-net
    restart: unless-stopped

  # =========================================================================
  # 3. CORE BACKEND SERVICE (ASP.NET CORE 10 WEB API)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jamesthew-backend
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=JamesThewDb;User Id=sa;Password=${SQL_PASSWORD:-JamesThew@2026SecurePass!};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-JamesThewCookingSecretKeyForJwtTokenAuth2026!#*VeryLongSecretKeyMustBe32BytesOrMore}
      - Jwt__Issuer=JamesThewApi
      - Jwt__Audience=JamesThewClient
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASS:-Admin@123456}
      - RabbitMQ__Enabled=true
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jamesthew-internal-net
    restart: unless-stopped

  # =========================================================================
  # 4. DATABASE: MICROSOFT SQL SERVER 2022
  # =========================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jamesthew-sqlserver
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:-JamesThew@2026SecurePass!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - jamesthew-internal-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD:-JamesThew@2026SecurePass!}' -Q 'SELECT 1' -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD:-JamesThew@2026SecurePass!}' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =========================================================================
  # 5. CACHE: REDIS 7 ALPINE
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: jamesthew-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jamesthew-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # =========================================================================
  # 6. MESSAGE BROKER: RABBITMQ 3.13 (WITH MANAGEMENT DASHBOARD)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jamesthew-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-Admin@123456}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - jamesthew-internal-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# ===========================================================================
# ISOLATED DOCKER BRIDGE NETWORK & NAMED PERSISTENCE VOLUMES
# ===========================================================================
networks:
  jamesthew-internal-net:
    driver: bridge
    name: jamesthew-internal-net

volumes:
  sqlserver_data:
    name: jamesthew-sqlserver-data
  redis_data:
    name: jamesthew-redis-data
  rabbitmq_data:
    name: jamesthew-rabbitmq-data

