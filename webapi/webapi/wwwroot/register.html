<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản | Hệ Thống Quản Trị eProject</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-bg-blob auth-bg-blob-1"></div>
    <div class="auth-bg-blob auth-bg-blob-2"></div>

    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <a href="#" class="auth-brand">
          <div class="auth-logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span class="auth-brand-text">ADMIN PORTAL</span>
        </a>
        <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
        <p class="auth-subtitle">Tạo tài khoản người dùng mới trong hệ thống</p>
      </div>

      <!-- Alert Message Box -->
      <div id="authAlert" class="auth-alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alertText"></span>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Họ và tên</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="fullName" class="form-input" placeholder="Nguyễn Văn A" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Tên đăng nhập</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
            </span>
            <input type="text" id="username" class="form-input" placeholder="nguyenvana" required minlength="3" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="email" class="form-input" placeholder="email@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="password" class="form-input" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password">
            <button type="button" class="input-toggle-password" id="btnTogglePassword" title="Hiện/ẩn mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </span>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="acceptTerms" required checked>
            <span>Tôi đồng ý với quy định & chính sách</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span id="btnText">Đăng Ký Ngay</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản?
        <a href="/login.html" class="form-link">Đăng nhập tại đây</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('registerForm');
      const authAlert = document.getElementById('authAlert');
      const alertText = document.getElementById('alertText');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const btnTogglePassword = document.getElementById('btnTogglePassword');
      const passwordInput = document.getElementById('password');

      btnTogglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      });

      function showAlert(msg, isError = true) {
        authAlert.className = isError ? 'auth-alert auth-alert-error show' : 'auth-alert auth-alert-success show';
        alertText.textContent = msg;
      }

      function hideAlert() {
        authAlert.classList.remove('show');
      }

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          showAlert('Mật khẩu xác nhận không khớp. Vui lòng kiểm tra lại!');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'Đang đăng ký...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, username, email, password })
          });

          const data = await res.json();

          if (!res.ok) {
            showAlert(data.message || 'Đăng ký không thành công.');
            btnSubmit.disabled = false;
            btnText.textContent = 'Đăng Ký Ngay';
            return;
          }

          showAlert('Tạo tài khoản thành công! Đang đăng nhập...', false);
          Auth.setAuth(data.token, data.user);

          setTimeout(() => {
            window.location.href = '/admin/index.html';
          }, 800);

        } catch (err) {
          console.error(err);
          showAlert('Lỗi kết nối máy chủ. Vui lòng thử lại sau.');
          btnSubmit.disabled = false;
          btnText.textContent = 'Đăng Ký Ngay';
        }
      });
    });
  </script>
</body>
</html>
